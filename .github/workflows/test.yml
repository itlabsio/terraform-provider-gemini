name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Тесты гоняют настоящий terraform против фейкового API Gemini.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...
      # docs/ генерируется из схемы и examples/ — должен быть закоммичен актуальным.
      - run: go tool tfplugindocs generate && git diff --exit-code -- docs
